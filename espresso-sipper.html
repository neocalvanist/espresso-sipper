<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Espresso Sipper</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #e8f5e9 0%, #fff8e1 50%, #efebe9 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    touch-action: manipulation;
    user-select: none;
  }
  header {
    padding: 16px 12px 8px;
    text-align: center;
    width: 100%;
  }
  h1 {
    font-size: 1.5rem;
    color: #2e7d32;
    font-weight: 700;
  }
  .subtitle {
    font-size: 0.85rem;
    color: #6d4c41;
    margin-top: 2px;
  }
  .counter-box {
    background: white;
    border-radius: 20px;
    padding: 12px 28px;
    box-shadow: 0 4px 15px rgba(46,125,50,0.15);
    margin: 8px 0 12px;
    text-align: center;
  }
  .count {
    font-size: 2.8rem;
    font-weight: 800;
    color: #1b5e20;
    line-height: 1;
  }
  .count-label {
    font-size: 0.9rem;
    color: #795548;
    letter-spacing: 0.5px;
  }
  .character-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 10px;
    cursor: pointer;
    position: relative;
  }
  .character {
    width: min(280px, 75vw);
    height: auto;
    transition: transform 0.15s ease;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.15));
  }
  .character.sip {
    transform: scale(1.08) translateY(-6px);
  }
  .tap-hint {
    margin-top: 12px;
    font-size: 0.95rem;
    color: #558b2f;
    opacity: 0.85;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  .steam {
    position: absolute;
    font-size: 1.5rem;
    opacity: 0;
    pointer-events: none;
    transition: all 0.6s ease-out;
  }
  .steam.show {
    opacity: 0.8;
    transform: translateY(-40px);
  }
  .badges-section {
    width: 100%;
    max-width: 420px;
    padding: 12px 16px 24px;
  }
  .badges-title {
    font-size: 1.1rem;
    color: #5d4037;
    margin-bottom: 10px;
    font-weight: 600;
    text-align: center;
  }
  .badges-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .badge {
    background: white;
    border-radius: 14px;
    padding: 10px 6px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: all 0.3s;
    opacity: 0.45;
    filter: grayscale(1);
  }
  .badge.unlocked {
    opacity: 1;
    filter: none;
    box-shadow: 0 4px 12px rgba(255, 193, 7, 0.35);
    transform: scale(1.02);
  }
  .badge img {
    width: 48px;
    height: 48px;
    object-fit: contain;
    margin-bottom: 4px;
  }
  .badge-name {
    font-size: 0.7rem;
    font-weight: 600;
    color: #4e342e;
    line-height: 1.2;
  }
  .badge-req {
    font-size: 0.65rem;
    color: #8d6e63;
    margin-top: 2px;
  }
  .toast {
    position: fixed;
    top: 20%;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #2e7d32;
    color: white;
    padding: 12px 20px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.95rem;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s ease;
    z-index: 100;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  footer {
    font-size: 0.7rem;
    color: #a1887f;
    padding-bottom: 12px;
  }
</style>
</head>

sipSound.volume = 0.7;


const countEl = document.getElementById('count');
const charImg = document.getElementById('charImg');
const toast = document.getElementById('toast');
const badgesEl = document.getElementById('badges');
const hint = document.getElementById('hint');

function updateUI() {
  countEl.textContent = count;
  badges.forEach(b => {
    const el = document.getElementById('badge-' + b.id);
    if (el) {
      if (unlocked.includes(b.id)) el.classList.add('unlocked');
      else el.classList.remove('unlocked');
    }
  });
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

function checkBadges() {
  badges.forEach(b => {
    if (count >= b.req && !unlocked.includes(b.id)) {
      unlocked.push(b.id);
      localStorage.setItem('espressoBadges', JSON.stringify(unlocked));
      showToast('🏅 Badge unlocked: ' + b.name + '!');
    }
  });
  updateUI();
}

function sip() {
  count++;
  localStorage.setItem('espressoCount', count);
  updateUI();
  checkBadges();

  // play sip sound
  try {
    sipSound.currentTime = 0;
    sipSound.play().catch(() => {});
  } catch(e) {}

  // animation
  charImg.src = imgSip;
  charImg.classList.add('sip');
  setTimeout(() => {
    charImg.src = imgNormal;
    charImg.classList.remove('sip');
  }, 450);

  if (count === 1) hint.style.display = 'none';
}

function renderBadges() {
  badgesEl.innerHTML = '';
  badges.forEach(b => {
    const div = document.createElement('div');
    div.className = 'badge' + (unlocked.includes(b.id) ? ' unlocked' : '');
    div.id = 'badge-' + b.id;
    div.innerHTML = `
      <img src="${badgeImg}" alt="badge">
      <div class="badge-name">${b.name}</div>
      <div class="badge-req">${b.req} sips</div>
    `;
    badgesEl.appendChild(div);
  });
}

document.getElementById('tapArea').addEventListener('click', sip);
document.getElementById('tapArea').addEventListener('touchstart', (e) => {
  e.preventDefault();
  sip();
}, {passive: false});

// init
countEl.textContent = count;
renderBadges();
updateUI();
if (count > 0) hint.style.display = 'none';
</script>
</body>
</html>
